# Same shape as publications.yml. Fields: title, description (required);
# url, code, paper, youtube, image, video, tags (all optional). video overrides image.

main:
  - title: Long-Horizon Loco-Manipulation
    description: Learning to adapt and interact in long-horizon loco-manipulation tasks with KYON, a quadruped equipped with two arms, from pick-carry-place to environment-interactive navigation (e.g., removing obstacles or using objects to reach a goal). Investigating (flow) policy learning and optimization over a learned world model, with a high-level policy emitting end-effector trajectories and base commands tracked by RL-based low-level controllers.
    tags: [RL, Flow Policies, World Models]

  - title: Multi-Skill Distillation
    description: Unifying multiple behaviors in a single policy via multi-expert distillation, coupling reinforcement learning and imitation learning. Applied to fall recovery and locomotion under joint failures for a quadruped, the policy autonomously selects the appropriate skill (getting up, quadrupedal or bipedal locomotion) by implicitly reconstructing the failure condition from proprioception only, without fault information or skill selection.
    video: /videos/mjdds_2faults_trmd_small.mp4
    tags: [RL, Imitation Learning, IsaacLab]

  - title: Fault-Tolerant Quadruped Locomotion
    url: https://gianni0907.github.io/fault_tolerant_locomotion
    youtube: https://www.youtube.com/watch?v=x4paP49SKuY
    description: Reinforcement Learning control policies for quadruped robots that adapt to joint failures, for robust locomotion in challenging environments.
    tags: [RL, MuJoCo Warp, Python]

  - title: Safe Navigation in Multi-Room Crowded Environments
    url: https://gianni0907.github.io/crowd_navigation
    code: https://github.com/gianni0907/crowdnav
    description: Sensor-based MPC-CBF framework for mobile robot navigation in dynamic environments, leveraging LiDAR and RGB-D data.
    tags: [MPC, Acados, Python, ROS, Gazebo]

  - title: Planning Throwing Motions for Mobile Manipulators
    code: https://github.com/gianni0907/Planning_Throwing_Motions_Mobile_Manipulator
    description: Offline trajectory optimization for balance-safe throwing motions in mobile manipulators, using fmincon from the MATLAB Optimization Toolbox.
    tags: [Trajectory Optimization, MATLAB]
